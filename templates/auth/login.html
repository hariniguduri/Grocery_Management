{% extends 'base.html' %} {% block title %}Login — GroceryMart{% endblock %} {%
block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div
      class="card shadow"
      style="border: none; border-top: 4px solid var(--accent-green)"
    >
      <div class="card-body p-4">
        <h2 class="text-center mb-4">Welcome Back</h2>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
              placeholder="Enter your email"
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
              placeholder="Enter your password"
            />
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
            Login
          </button>
        </form>

        <p class="text-center mt-3 text-muted">
          Don't have an account?
          <a href="{{ url_for('auth.register') }}" class="text-success-dark"
            >Register here</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
